name: Rust CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: Authentication System with 2FA

jobs:

  # ==========================================
  # 1. FORMAT
  # ==========================================
  format:
    name: Rustfmt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check


  # ==========================================
  # 2. CLIPPY
  # ==========================================
  clippy:
    name: Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install Clippy
        run: rustup component add clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Authentication System with 2FA/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Authentication System with 2FA/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings


  # ==========================================
  # 3. TEST
  # ==========================================
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Authentication System with 2FA/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Authentication System with 2FA/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --all-features --verbose


  # ==========================================
  # 4. BUILD
  # ==========================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - format
      - clippy
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Authentication System with 2FA/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Authentication System with 2FA/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-2fa-release
          path: Authentication System with 2FA/target/release/