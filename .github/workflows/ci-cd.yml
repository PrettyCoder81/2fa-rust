name: Rust CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:

  # ==========================================
  # 1. FORMAT
  # ==========================================
  format:
    name: Rustfmt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # ==========================================
  # 2. CLIPPY
  # ==========================================
  clippy:
    name: Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install Clippy
        run: rustup component add clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ./target
          key: ${{ runner.os }}-cargo-${{ hashFiles('./Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings


  # ==========================================
  # 3. TEST
  # ==========================================
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ./target
          key: ${{ runner.os }}-cargo-${{ hashFiles('./Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --all-features --verbose


  # ==========================================
  # 4. BUILD
  # ==========================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - format
      - clippy
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ./target
          key: ${{ runner.os }}-cargo-${{ hashFiles('./Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-2fa-release
          path: target/release/silver-rocket

  # ==========================================
  # 5. DEPLOY
  # ==========================================
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest

    # needs:
    #   - build

    if: github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: rust-2fa-release
          path: release/silver-rocket

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_HOST" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/deploy_key
          chmod 644 ~/.ssh/known_hosts


      - name: Upload release
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          scp \
          -i ~/.ssh/deploy_key \
          -o StrictHostKeyChecking=yes \
          release/silver-rocket \
          "${DEPLOY_USER}@${DEPLOY_HOST}:/var/www/2fa-rust/releases/silver-rocket"

      # - name: Script commd=and
