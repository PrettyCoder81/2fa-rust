name: Rust CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:

  # ==========================================
  # 1. FORMAT
  # ==========================================
  format:
    name: Rustfmt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check


  # ==========================================
  # 2. CLIPPY
  # ==========================================
  clippy:
    name: Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install Clippy
        run: rustup component add clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings


  # ==========================================
  # 3. TEST
  # ==========================================
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --all-features --verbose


  # ==========================================
  # 4. BUILD
  # ==========================================
  build:
    name: Build
    runs-on: ubuntu-latest

    needs:
      - format
      - clippy
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release

      - name: Verify release binary
        run: |
          set -euo pipefail

          test -f target/release/silver-rocket
          test -x target/release/silver-rocket

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-2fa-release
          path: target/release/silver-rocket
          if-no-files-found: error


  # ==========================================
  # 5. DEPLOY
  # ==========================================
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest

    needs:
      - build

    # Deploy only after a push to main.
    # Pull requests will NOT deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:

      # ========================================
      # Download build artifact
      # ========================================
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: rust-2fa-release
          path: release


      # ========================================
      # Verify release
      # ========================================
      - name: Verify release
        shell: bash
        run: |
          set -euo pipefail

          test -f release/silver-rocket

          chmod +x release/silver-rocket

          ls -lah release/silver-rocket


      # ========================================
      # Configure SSH
      # ========================================
      #
      # GitHub Secrets required:
      #
      # DEPLOY_SSH_KEY
      # PROD_KNOWN_HOSTS
      # DEPLOY_HOST
      # DEPLOY_USER
      #
      # ========================================
      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key

          printf '%s\n' "$PROD_KNOWN_HOSTS" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/deploy_key
          chmod 644 ~/.ssh/known_hosts


      # ========================================
      # Prepare production release
      # ========================================
      - name: Prepare production release
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          RELEASE_ID="${GITHUB_SHA}"

          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p /var/www/2fa-rust/releases/${RELEASE_ID}"


      # ========================================
      # Upload release
      # ========================================
      - name: Upload release
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          RELEASE_ID="${GITHUB_SHA}"

          scp \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            release/silver-rocket \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/var/www/2fa-rust/releases/${RELEASE_ID}/silver-rocket"


      # ========================================
      # Configure release
      # ========================================
      - name: Configure release
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          RELEASE_ID="${GITHUB_SHA}"

          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod +x /var/www/2fa-rust/releases/${RELEASE_ID}/silver-rocket"


      # ========================================
      # Activate release
      # ========================================
      - name: Activate release
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          RELEASE_ID="${GITHUB_SHA}"

          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "
              set -e

              ln -sfn \
                /var/www/2fa-rust/releases/${RELEASE_ID} \
                /var/www/2fa-rust/current
            "


      # ========================================
      # Restart PM2
      # ========================================
      - name: Restart application
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            '
              set -e

              cd /var/www/2fa-rust

              if sudo pm2 describe 2fa-rust > /dev/null 2>&1; then
                sudo pm2 restart 2fa-rust
              else
                sudo pm2 start \
                  /var/www/2fa-rust/current/silver-rocket \
                  --name 2fa-rust
              fi

              sudo pm2 save

              sudo pm2 status
            '


      # ========================================
      # Deployment verification
      # ========================================
      - name: Verify deployment
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            '
              set -e

              echo "======================================"
              echo "Current release"
              echo "======================================"

              readlink -f /var/www/2fa-rust/current

              echo
              echo "======================================"
              echo "Binary"
              echo "======================================"

              ls -lah /var/www/2fa-rust/current/silver-rocket

              echo
              echo "======================================"
              echo "PM2 status"
              echo "======================================"

              sudo pm2 status
            '